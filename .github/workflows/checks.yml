name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python has no Python 3.9 build for the current Ubuntu runner, so uv provides
      # the interpreter (a python-build-standalone build) in a virtual environment for every version.
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and the development tools
        run: |
          uv venv --python ${{ matrix.python-version }} --seed "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" --version
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        env:
          PYTHONPATH: src
        run: python -W error -m unittest discover -s tests -t . -v
      - name: Install the package and run the command line twice
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          MODEL="$GITHUB_WORKSPACE/crates/wesley-parley/tests/golden/model.json"
          python -m wesley_parley python --model "$MODEL" > first.py
          wesley-parley-python python < "$MODEL" > second.py
          cmp first.py second.py
          cmp first.py "$GITHUB_WORKSPACE/python/tests/golden/messages.py"
