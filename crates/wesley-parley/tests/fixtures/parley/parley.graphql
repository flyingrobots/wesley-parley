# Parley's 17 messages in Wesley SDL.
#
# NOT YET THE SOURCE. The hand-written JSON Schemas beside this file (schemas/<id>.schema.json)
# are the source of truth until flyingrobots/parley#119 generates them from this file. Until then
# scripts/sdl-agreement.test.ts holds this file to them: it lowers it with the pinned Wesley
# (package.json config.wesley), derives each message's JSON Schema value from the IR and the
# interim directives below, and fails on any difference. A change to a message changes both, in
# the same commit (docs/workflows/change-a-message).
#
# One file, because Wesley 0.3.0-alpha.4 keeps only the last of repeated --schema flags
# (flyingrobots/wesley#846) and merges two definitions of one type silently (flyingrobots/wesley#845).
#
# Conventions, which the derivation enforces:
# - A field with `!` is required. A field without it is optional and carries @parley_optional:
#   absent when unset, never null.
#   The one exception is a `JSON` field (@parley_scalar(json: "any")): it renders no constraint at
#   all, so an explicit null validates there, as it does in the hand-written schema.
# - A string or integer constraint on a list field constrains its items; @parley_minItems and
#   @parley_maxItems constrain the list.
# - Every object type is @parley_open or @parley_closed. Only SchemaRef is closed (spec §4.5).
# - A nested type has no description of its own: the field that uses it carries it.
# - Fields are in the order of the schema's properties, so `required` comes out in that order.

# ---------------------------------------------------------------------------------------------
# Interim directives. Each stands for a construct Wesley 0.3.0-alpha.4 does not have, and is
# retired when the issue named above it lands. docs/topics/message-sdl/README.md has the table.
# Wesley keeps no directive definitions in its IR (flyingrobots/wesley#772), so these declarations
# are read by the agreement test from this file's text, not from Wesley.
# ---------------------------------------------------------------------------------------------

# A message type: its schema id, version and title. flyingrobots/wesley#856
directive @parley_message(id: String!, version: String!, title: String!) on OBJECT
# A signed 64-bit integer scalar: JSON integer. flyingrobots/wesley#850
directive @parley_int64 on SCALAR
# A custom scalar's JSON kind: "any" (any JSON value) or "object" (any JSON object). flyingrobots/wesley#851
directive @parley_scalar(json: String!) on SCALAR
# Optional means absent when unset, never null. flyingrobots/wesley#852
directive @parley_optional on FIELD_DEFINITION
# A literal-valued field; give exactly one argument. flyingrobots/wesley#853
directive @parley_const(string: String, int: Int, bool: Boolean) on FIELD_DEFINITION
# `_schema`: the closed {id, version} pinned to this message's own id and version. flyingrobots/wesley#853
directive @parley_message_ref on FIELD_DEFINITION
# A closed set of string values that are not GraphQL enum names (hyphens). flyingrobots/wesley#854
directive @parley_enum(values: [String!]!) on FIELD_DEFINITION
# An object that admits fields it does not name. flyingrobots/wesley#855
directive @parley_open on OBJECT
# An object that admits no field it does not name. flyingrobots/wesley#855
directive @parley_closed on OBJECT
# String constraints. flyingrobots/wesley#857
directive @parley_pattern(regex: String!) on FIELD_DEFINITION
# flyingrobots/wesley#857
directive @parley_minLength(value: Int!) on FIELD_DEFINITION
# flyingrobots/wesley#857
directive @parley_format(name: String!) on FIELD_DEFINITION
# Integer constraints. flyingrobots/wesley#857
directive @parley_minimum(value: Int!) on FIELD_DEFINITION
# flyingrobots/wesley#857
directive @parley_maximum(value: Int!) on FIELD_DEFINITION
# One excluded value. flyingrobots/wesley#857
directive @parley_not_equal(int: Int!) on FIELD_DEFINITION
# List constraints. flyingrobots/wesley#857
directive @parley_minItems(value: Int!) on FIELD_DEFINITION
# flyingrobots/wesley#857
directive @parley_maxItems(value: Int!) on FIELD_DEFINITION
# Object constraint. flyingrobots/wesley#857
directive @parley_minProperties(value: Int!) on FIELD_DEFINITION
# Cross-field: at most one of these fields is present. flyingrobots/wesley#857
directive @parley_exclusive(fields: [String!]!) on OBJECT
# Cross-field: at least one of these list fields is present and non-empty. flyingrobots/wesley#857
directive @parley_any_non_empty(fields: [String!]!) on OBJECT
# Cross-field: when the field at `path` equals the value, the named fields of its parent are
# required (`require`) or hold the given values (`set`); with `forbidOtherwise`, the required
# fields are forbidden when it does not. `guarded`: the rule fires only when every field on the
# path is present. flyingrobots/wesley#857
directive @parley_when(path: [String!]!, equals: JSON!, guarded: Boolean!, require: [String!], forbidOtherwise: Boolean, set: JSON) on OBJECT

# ---------------------------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------------------------

"A signed 64-bit integer: POSIX milliseconds, byte counts. GraphQL Int is 32-bit."
scalar Int64 @parley_int64
"Any JSON value."
scalar JSON @parley_scalar(json: "any")
"Any JSON object, its shape the tool's."
scalar JSONObject @parley_scalar(json: "object")

# ---------------------------------------------------------------------------------------------
# Shared shapes
# ---------------------------------------------------------------------------------------------

type SchemaRef @parley_closed {
  id: String!
  "Full validation is against the schema for this exact id and version (spec §4.5, §4.6)."
  version: String!
}

type InputDescriptor @parley_open @parley_exclusive(fields: ["sha256", "error"]) {
  path: String! @parley_minLength(value: 1)
  role: String @parley_optional @parley_minLength(value: 1)
  sha256: String @parley_optional @parley_pattern(regex: "^[0-9a-f]{64}$")
  "Why the input could not be read; no digest then."
  error: String @parley_optional @parley_pattern(regex: "^[a-z0-9_]+(\\.[a-z0-9_]+)+$")
}

# ---------------------------------------------------------------------------------------------
# parley.run.bootstrap
# ---------------------------------------------------------------------------------------------

type ReceiptPaths @parley_open {
  "Absolute path of the receipt file for this run (spec §5). The only path the protocol defines; a program may add others it documents."
  receipt: String! @parley_pattern(regex: "^/") @parley_minLength(value: 2)
}

"First line of stdout, emitted before work begins so a crashed run still names its receipt."
type RunBootstrap @parley_message(id: "parley.run.bootstrap", version: "1.1.1", title: "parley run bootstrap") @parley_open {
  event: String! @parley_const(string: "run")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The bootstrap line is always the first line the run emits, so it is the only line with a pinned seq."
  seq: Int! @parley_const(int: 0)
  tool: String! @parley_minLength(value: 1)
  "The program's own version, distinct from _schema.version on the same line (spec §3)."
  v: String! @parley_minLength(value: 1)
  "Content-addressed identity of the question: tool, version, normalised args, and the bytes of every declared input; never a declared secret (spec §2.2, §5.3). Optional in v0.2: supplied when the tool documents its derivation and the identity is known at this point; never a placeholder (spec §2.2)."
  inv: String @parley_optional @parley_minLength(value: 1)
  "Unique, lexicographically sortable identity of this execution."
  run: String! @parley_minLength(value: 1)
  "Working period spanning runs. Supplied by the caller or inherited."
  session: String @parley_optional @parley_minLength(value: 1)
  "Files this run writes."
  paths: ReceiptPaths!
  _schema: SchemaRef! @parley_message_ref
  "True when the run performed no subject-matter writes, no mutating remote action and no retention deletion (spec §4.3). Absent means false."
  dry_run: Boolean @parley_optional
}

# ---------------------------------------------------------------------------------------------
# parley.receipt.head
# ---------------------------------------------------------------------------------------------

type HeadEffects @parley_open {
  reads: [String!] @parley_optional
  writes: [String!] @parley_optional
  network: Boolean @parley_optional
  idempotent: Boolean @parley_optional
}

type HeadRedacted @parley_open @parley_any_non_empty(fields: ["argv", "resolved", "inputs", "env", "sources"]) {
  "Indexes into argv."
  argv: [Int!] @parley_optional @parley_minimum(value: 0)
  "JSON Pointers (RFC 6901) into resolved."
  resolved: [String!] @parley_optional @parley_format(name: "json-pointer") @parley_minLength(value: 1)
  "Names of declared environment variables that were present."
  env: [String!] @parley_optional @parley_minLength(value: 1)
  "Indexes into inputs whose path carried a replaced value."
  inputs: [Int!] @parley_optional @parley_minimum(value: 0)
  "Logical names of declared credential sources that were present (spec §5.3)."
  sources: [String!] @parley_optional @parley_minLength(value: 1)
}

"First line of a receipt file. Carries what the bootstrap line deliberately omitted, so stdout stays small while the record stays complete."
type ReceiptHead @parley_message(id: "parley.receipt.head", version: "2.0.0", title: "parley receipt head") @parley_open {
  event: String! @parley_const(string: "receipt.head")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter continues from the bootstrap line, which is seq 0 (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1). ULID or equivalent: unique per execution and lexicographically sortable."
  run: String! @parley_minLength(value: 1)
  "The program that wrote this receipt, so a receipt read alone says what produced it (spec §5)."
  tool: String! @parley_minLength(value: 1)
  "That program's own version; with tool, a component of the inv preimage (spec §2.2) that a receipt read alone must carry."
  v: String! @parley_minLength(value: 1)
  "Content-addressed identity of the question (spec §2.2); never includes a declared secret. Optional in v0.2: supplied when the tool documents its derivation and the identity is known at this point; never a placeholder (spec §2.2)."
  inv: String @parley_optional @parley_minLength(value: 1)
  session: String @parley_optional @parley_minLength(value: 1)
  "As received, after §5.3 redaction: a declared secret appears as the literal [redacted]."
  argv: [String!]!
  "After defaults, environment and path resolution. The gap between this and argv is where bugs live."
  resolved: JSONObject!
  "Every declared input as a descriptor: its path, its role when the tool distinguishes roles, and a content digest once read. A digest that arrives later is carried by receipt.inputs (spec §2.2). Credential files are never inputs (§2.2)."
  inputs: [InputDescriptor!]!
  effects: HeadEffects @parley_optional
  _schema: SchemaRef! @parley_message_ref
  "Present and non-empty whenever a declared secret was supplied to the run; absent otherwise (spec §5.3). Lists where the head carries a replaced value, and which credential sources were present."
  redacted: HeadRedacted @parley_optional @parley_minProperties(value: 1)
  "True when the run performed no subject-matter writes, no mutating remote action and no retention deletion (spec §4.3). Absent means false."
  dry_run: Boolean @parley_optional
}

# ---------------------------------------------------------------------------------------------
# parley.error, parley.warning, parley.startup.failed
# ---------------------------------------------------------------------------------------------

"Errors are data. measured, limit and remedy are what make an error actionable in one step rather than several."
type Error @parley_message(id: "parley.error", version: "2.0.0", title: "parley error") @parley_open {
  event: String! @parley_const(string: "error")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter; 0 is the bootstrap line (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to. Required on every line so a detached line can still be attributed (spec §1.3)."
  run: String! @parley_minLength(value: 1)
  "Stable identifier: two or more dot-separated segments of lowercase letters, digits and underscores (spec §6). Never a prose message."
  code: String! @parley_pattern(regex: "^[a-z0-9_]+(\\.[a-z0-9_]+)+$")
  "What is wrong, in one sentence."
  problem: String! @parley_minLength(value: 1)
  "The value observed, when the failure is a threshold."
  measured: JSON @parley_optional
  "The threshold that was not met."
  limit: JSON @parley_optional
  "The lever to pull. Omit rather than invent one."
  remedy: String @parley_optional
  "What the remedy applies to."
  remedy_target: String @parley_optional
  retryable: Boolean @parley_optional
  _schema: SchemaRef! @parley_message_ref
}

"A recovered condition: the same shape as an error, on stderr and in the receipt, never changing the exit status (spec §6.1)."
type Warning @parley_message(id: "parley.warning", version: "1.0.0", title: "parley warning") @parley_open {
  event: String! @parley_const(string: "warning")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter; 0 is the bootstrap line (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to. Required on every line so a detached line can still be attributed (spec §1.3)."
  run: String! @parley_minLength(value: 1)
  "Stable identifier: two or more dot-separated segments of lowercase letters, digits and underscores (spec §6). Never a prose message."
  code: String! @parley_pattern(regex: "^[a-z0-9_]+(\\.[a-z0-9_]+)+$")
  "What is wrong, in one sentence."
  problem: String! @parley_minLength(value: 1)
  "The value observed, when the failure is a threshold."
  measured: JSON @parley_optional
  "The threshold that was not met."
  limit: JSON @parley_optional
  "The lever to pull. Omit rather than invent one."
  remedy: String @parley_optional
  "What the remedy applies to."
  remedy_target: String @parley_optional
  _schema: SchemaRef! @parley_message_ref
}

"The single line a run emits, on stderr, when it cannot reach the bootstrap line; exit status 3 (spec §3.2)."
type StartupFailed @parley_message(id: "parley.startup.failed", version: "1.0.0", title: "parley startup failed") @parley_open {
  event: String! @parley_const(string: "startup.failed")
  t: Int64! @parley_minimum(value: 0)
  "The only line the run emits (spec §1.3, §3.2)."
  seq: Int! @parley_const(int: 0)
  run: String! @parley_minLength(value: 1)
  tool: String! @parley_minLength(value: 1)
  v: String! @parley_minLength(value: 1)
  "A §6 code in the startup namespace."
  code: String! @parley_pattern(regex: "^startup\\.[a-z0-9_]+(\\.[a-z0-9_]+)*$")
  problem: String! @parley_minLength(value: 1)
  remedy: String @parley_optional
  remedy_target: String @parley_optional
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.end
# ---------------------------------------------------------------------------------------------

"The terminal event of a run that bootstrapped: written to stdout and to the receipt as one event. Its seq is the run's final sequence number (spec §3.3)."
type End @parley_message(id: "parley.end", version: "1.0.0", title: "parley end") @parley_open {
  event: String! @parley_const(string: "end")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "The exit status the process is about to exit with (spec §3.4); never 3, since a run that could not bootstrap has no end."
  status: Int! @parley_minimum(value: 0) @parley_maximum(value: 255) @parley_not_equal(int: 3)
  "The receipt path, absolute, as the bootstrap line declared it."
  receipt: String! @parley_pattern(regex: "^/") @parley_minLength(value: 2)
  "True exactly when the head carries redacted or any redaction event was emitted (spec §3.3)."
  redacted: Boolean!
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.sidecar, parley.redaction, parley.receipt.step, parley.receipt.inputs
# ---------------------------------------------------------------------------------------------

"A receipt line standing in for a record stored beside the receipt because it exceeded the inline threshold (spec §5)."
type Sidecar @parley_message(id: "parley.sidecar", version: "1.0.0", title: "parley sidecar") @parley_open {
  event: String! @parley_const(string: "sidecar")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "The seq of the record the sidecar holds."
  source: Int! @parley_minimum(value: 1)
  "Relative to the receipt's directory; never absolute, never escaping it."
  path: String! @parley_minLength(value: 1) @parley_pattern(regex: "^(?!/)(?!.*(^|/)\\.\\.(/|$)).+$")
  "Length of the stored bytes."
  bytes: Int64! @parley_minimum(value: 0)
  "SHA-256 of the stored bytes; not the semantic digest of §7.1."
  sha256: String! @parley_pattern(regex: "^[0-9a-f]{64}$")
  _schema: SchemaRef! @parley_message_ref
}

"A receipt line recording a redaction not covered by the head's redacted field: in the head itself (in: 1) or in any later record or sidecar (spec §5.3)."
type Redaction @parley_message(id: "parley.redaction", version: "1.0.0", title: "parley redaction") @parley_open {
  event: String! @parley_const(string: "redaction")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "The seq of the affected record: the head, a result, an error, a reasoning line, or the stored record a sidecar holds (its source)."
  in: Int! @parley_minimum(value: 1)
  "JSON Pointer (RFC 6901) within that record."
  at: String! @parley_format(name: "json-pointer") @parley_minLength(value: 1)
  _schema: SchemaRef! @parley_message_ref
}

"One decision the program made while working, with its reason; receipt only (spec §5)."
type ReceiptStep @parley_message(id: "parley.receipt.step", version: "1.0.0", title: "parley receipt step") @parley_open {
  event: String! @parley_const(string: "receipt.step")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  decision: String! @parley_minLength(value: 1)
  because: String! @parley_minLength(value: 1)
  detail: JSONObject @parley_optional
  _schema: SchemaRef! @parley_message_ref
}

"The metadata-finalisation record: late input digests and, when known, inv; emitted once inputs are settled and before end (spec §2.2)."
type ReceiptInputs @parley_message(id: "parley.receipt.inputs", version: "1.0.0", title: "parley receipt inputs") @parley_open {
  event: String! @parley_const(string: "receipt.inputs")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "Every declared input as a descriptor: its path, its role when the tool distinguishes roles, and a content digest once read. A digest that arrives later is carried by receipt.inputs (spec §2.2). Credential files are never inputs (§2.2)."
  inputs: [InputDescriptor!]!
  "Present when the identity could be computed (spec §2.2)."
  inv: String @parley_optional @parley_minLength(value: 1)
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.cache.hit, parley.page
# ---------------------------------------------------------------------------------------------

"Emitted when a program answers from a prior receipt instead of recomputing (spec §2.3)."
type CacheHit @parley_message(id: "parley.cache.hit", version: "1.0.0", title: "parley cache hit") @parley_open {
  event: String! @parley_const(string: "cache.hit")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  inv: String! @parley_minLength(value: 1)
  "The run whose receipt supplied the answer."
  served_run: String! @parley_minLength(value: 1)
  "That receipt's path."
  receipt: String! @parley_minLength(value: 1)
  _schema: SchemaRef! @parley_message_ref
}

"One page of unbounded output; cursor required when has_more is true (spec §7.2)."
type Page @parley_message(id: "parley.page", version: "1.0.0", title: "parley page") @parley_open
  @parley_when(path: ["has_more"], equals: true, guarded: false, require: ["cursor"]) {
  event: String! @parley_const(string: "page")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "Opaque to the caller."
  cursor: String @parley_optional @parley_minLength(value: 1)
  has_more: Boolean!
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.command, parley.schema
# ---------------------------------------------------------------------------------------------

enum BookkeepingOp { create append delete }

type Bookkeeping @parley_open {
  op: BookkeepingOp!
  scope: String! @parley_minLength(value: 1)
}

type CommandEffects @parley_open {
  reads: [String!]! @parley_minLength(value: 1)
  "Subject-matter writes only (spec §4.3)."
  writes: [String!]! @parley_minLength(value: 1)
  network: Boolean!
  idempotent: Boolean!
  "Evidence writes: receipts, sidecars, the local ignore file, retention (spec §4.3)."
  bookkeeping: [Bookkeeping!]!
}

type EmittedType @parley_open {
  id: String! @parley_minLength(value: 1)
  version: String! @parley_pattern(regex: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
}

"A command's description: name, intent, declared effects, declared secrets and the message types it can emit (spec §4.1 to §4.3). Emitted by --schema and --help."
type Command @parley_message(id: "parley.command", version: "1.0.0", title: "parley command") @parley_open {
  event: String! @parley_const(string: "command")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  name: String! @parley_minLength(value: 1)
  "One line: what question the command answers."
  intent: String! @parley_minLength(value: 1)
  effects: CommandEffects!
  "Arguments by flag, environment variables by name, and credential sources by logical name, whose values are secrets (spec §4.3, §5.3)."
  secrets: [String!]! @parley_minLength(value: 1)
  "Message types this command can emit, by exact (id, version)."
  emits: [EmittedType!]!
  _schema: SchemaRef! @parley_message_ref
}

"One message schema, carried by --schema and --help (spec §4.1, §4.2)."
type MessageSchema @parley_message(id: "parley.schema", version: "1.0.0", title: "parley schema") @parley_open {
  event: String! @parley_const(string: "schema")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  id: String! @parley_minLength(value: 1)
  version: String! @parley_pattern(regex: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
  "The JSON Schema document for that exact (id, version)."
  schema: JSONObject!
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.query
# ---------------------------------------------------------------------------------------------

type QueryAsker @parley_open {
  "The calling program, named as in spec §2.1. Established from the caller's own identity or supplied as one argument; never invented, so a read that cannot establish it is refused."
  tool: String! @parley_minLength(value: 1)
  "Absolute POSIX working directory the read was made from. Inferred from the process; omitted when it is not meaningful."
  cwd: String @parley_optional @parley_pattern(regex: "^/") @parley_minLength(value: 2)
  "The caller's current task id, supplied by the caller and never inferred (flyingrobots/parley#61); omitted when the caller does not state it. Not the session: a session is a working period, a task is a unit of work inside one."
  task: String @parley_optional @parley_minLength(value: 1)
}

type QueryBudget @parley_open {
  "The most records the answer may name. Required: a view with no bound collapses into \"return every record\"."
  records: Int! @parley_minimum(value: 1)
  "The most bytes the answer may occupy."
  bytes: Int64 @parley_optional @parley_minimum(value: 1)
  "The most wall-clock milliseconds the read may spend."
  ms: Int64 @parley_optional @parley_minimum(value: 1)
}

type QueryWindow @parley_open {
  "Inclusive lower bound of the window, POSIX time in milliseconds. 0 means \"from the start of the history\"."
  from: Int64! @parley_minimum(value: 0)
  "Inclusive upper bound of the window, POSIX time in milliseconds. Never below from."
  to: Int64! @parley_minimum(value: 0)
}

type RecordId @parley_open {
  run: String! @parley_minLength(value: 1)
  "0 for a bootstrap or startup-failure line (spec §1.3)."
  seq: Int! @parley_minimum(value: 0)
}

"A read against the history, recorded as an event: the asker it is for, the view it wants, the budget it will accept and the window it covers (spec §9, informative; the representation is decided in flyingrobots/parley#46 and read against the observer-geometry treatment in docs/topics/related-work/observer-geometry.md). The envelope's run is the read's own run; asker is who the read is for. A drill-down, which opens records a lens named, is the same message with records stating which."
type ReadQuery @parley_message(id: "parley.query", version: "1.1.0", title: "parley query") @parley_open {
  event: String! @parley_const(string: "query")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to: the read itself, not the runs being read (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "Working period spanning runs. Supplied by the caller or inherited; never invented (spec §2.1)."
  session: String @parley_optional @parley_minLength(value: 1)
  "Who the read is for, and the context the budget is inferred from. The asker is not the view: two askers requesting the same view under the same budget get the same answer."
  asker: QueryAsker!
  "The shape of the answer, one token from a closed set. Never inferred: there is no privileged view, so a missing view is refused rather than guessed. Adding a token is a version of this schema."
  view: String! @parley_enum(values: ["what-ran", "what-failed", "what-changed", "how-it-decided", "everything"])
  "The size of answer the asker will accept. One documented default applies when it is not supplied, and the applied budget is carried verbatim by the result's lens, so a default is never invisible."
  budget: QueryBudget!
  "The stretch of history the read covers, always stated as two timestamps and echoed by the result's lens."
  window: QueryWindow!
  "Free text from the asker, recorded and never parsed. Nothing in the answer branches on it."
  note: String @parley_optional @parley_minLength(value: 1)
  "Whether the read may fold runs it judges to be repeats of one invocation with one result into the most recent of them (flyingrobots/parley#79). false: nothing is folded, so every run in the window keeps its own records and the budget alone decides what the answer names (flyingrobots/parley#133). true or absent: the reader folds, and the result's lens names the runs a fold stands for in the section of the run that stands for them (parley.lens runs.folded.stands_for). The budget can leave that run out of the answer, and its section with it; the lens then reports that fold as a count alone (parley.lens loss.folded). Never inferred: the reader records it only when the asker states it, and the lens echoes it. It selects nothing on a drill-down."
  fold: Boolean @parley_optional
  "Present only on a drill-down: the records the read asks for by (run, seq), the identity a parley.lens names them by, in the order asked (flyingrobots/parley#51). A drill-down answers with exactly these records in full, a sidecar's stored record included, and an outcome per id; the view and window are recorded and select nothing, budget.records is the number of ids asked, and budget.bytes, when stated, bounds the records opened: whole records in the order asked while their summed size stays within it, and an over_budget outcome with no contents for each id past it (flyingrobots/parley#78). Absent on a read that answers with a digest."
  records: [RecordId!] @parley_optional @parley_minItems(value: 1)
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.lens
# ---------------------------------------------------------------------------------------------

type LensQueryRef @parley_open {
  run: String! @parley_minLength(value: 1)
  seq: Int! @parley_minimum(value: 1)
}

type LensAsker @parley_open {
  tool: String! @parley_minLength(value: 1)
  cwd: String @parley_optional @parley_pattern(regex: "^/") @parley_minLength(value: 2)
  task: String @parley_optional @parley_minLength(value: 1)
}

type LensBudget @parley_open {
  records: Int! @parley_minimum(value: 1)
  bytes: Int64 @parley_optional @parley_minimum(value: 1)
  ms: Int64 @parley_optional @parley_minimum(value: 1)
}

type LensWindow @parley_open {
  from: Int64! @parley_minimum(value: 0)
  to: Int64! @parley_minimum(value: 0)
}

type LensLoss @parley_open {
  "What kind of statement the loss is. none: nothing in the window was left out, so the result and the window hold the same records and excluded must be 0. Not restricted to the identity view: a view orders a result and filters none of it (flyingrobots/parley#49), so any view whose result reached the end of its order lost nothing. count-only: the excluded count is all that is known, which is a weak proxy. A measured distortion bound needs a translator to measure it and is a later version of this schema."
  bound: String! @parley_enum(values: ["none", "count-only"])
  "How many records in the window the view did not name, whatever left them out: the budget, or a fold (folded). A proxy and a weak one: one withheld record can matter more than fifty, so this count cannot bound what the view loses."
  excluded: Int! @parley_minimum(value: 0)
  "How many of excluded were left out because their run was folded into another run of the same invocation and the same result, rather than by the budget (flyingrobots/parley#79): the records of every run the fold left out. A runs section's folded.records counts those its own run stands for, so the sections' folded.records sum to this number unless the budget left a run that stands for others out of records; that run has no section, so the sum is then smaller and this count is all the lens says of its fold. It depends on the window, the view and fold, never on the budget, so excluded minus folded is what the budget cut. At most excluded, which a schema cannot check; a reader can. Optional so that lines written under the earlier drafts still validate; parley-read always writes it, 0 included."
  folded: Int @parley_optional @parley_minimum(value: 0)
}

enum RunOutcome { failed undetermined succeeded }
enum RunReason { no_end_in_window end_status_unusable }
enum DroppedField { resolved argv inv v tool }

type RunFolded @parley_open {
  "How many other runs this section stands for, this run excluded: the section reads as this run plus others like it, so it stands for others + 1 runs (flyingrobots/parley#100)."
  others: Int! @parley_minimum(value: 1)
  "How many records of those other runs, in the window, the fold left out of records, this run's own excluded; each is counted in loss.excluded and loss.folded."
  records: Int! @parley_minimum(value: 0)
  "The run ids of the other runs this section stands for, this run excluded, most recent first by the rule that makes this run the most recent of them: the latest t among each run's records in the window, then the greater run id, a run with no dated record last (flyingrobots/parley#133). It names runs, not records: the others' seq numbers are not listed and need not be this run's, so their records are read under a window that holds them with fold false, or opened by (run, seq) once their seq is known. As many as others, which a schema cannot check; a reader can. Optional, as every field a minor version adds is (spec §4.5); parley-read always writes it, never shortens it, never drops it to fit the section's bound and does not count it against that bound. It is part of the line budget.bytes bounds: when the line cannot hold it whole, no record of this run is named and this section is absent, and loss.folded still counts the fold."
  stands_for: [String!] @parley_optional @parley_minItems(value: 1) @parley_minLength(value: 1)
}

type RunSection @parley_open
  @parley_when(path: ["outcome"], equals: "undetermined", guarded: true, require: ["reason"], forbidOtherwise: true) {
  "The run this section is about: one that records names."
  run: String! @parley_minLength(value: 1)
  "The run's receipt head's tool (spec §5), as the loader read it."
  tool: String @parley_optional @parley_minLength(value: 1)
  "The run's receipt head's v (spec §5), as the loader read it."
  v: String @parley_optional @parley_minLength(value: 1)
  "The run's receipt head's argv (spec §5), already redacted there (spec §5.3). Never cut part-way: when it does not fit the section's bound it is dropped whole and named in dropped."
  argv: [String!] @parley_optional
  "The run's receipt head's resolved (spec §5): its interpretation after defaults, environment and path resolution, copied whole and already redacted there (spec §5.3), so a reader can tell, say, which commits a run compared without opening the head (flyingrobots/parley#90). Its shape is the tool's; the reader chooses none of its keys. Never cut part-way: when it does not fit the section's bound it is dropped whole, first of all fields, and named in dropped. Absent when the window does not hold the head or the head's resolved is not an object."
  resolved: JSONObject @parley_optional
  "The run's inv (spec §2.2): the head's, or else the window's receipt.inputs for the run. Absent when neither carries one; never a placeholder."
  inv: String @parley_optional @parley_minLength(value: 1)
  "What the records in the window establish about the run: failed for an error, a startup failure or a non-zero end; succeeded for an end of 0 and nothing against it; undetermined otherwise (spec §1.2a). It is the window's verdict, not the digest's: a run whose end the bound cut is still succeeded. Absent when the reader established none."
  outcome: RunOutcome @parley_optional
  "Why the outcome is undetermined, present exactly when it is. no_end_in_window: the window holds no end for the run, which cannot say whether the run ended later or never did. end_status_unusable: the window holds an end whose status is not a number."
  reason: RunReason @parley_optional
  "Present when the window does not hold the run's receipt head, so tool, v and argv are not known from it. Absent when it does."
  head: String @parley_optional @parley_const(string: "not_in_window")
  "Present when this run stands for other runs of the same invocation and the same result (flyingrobots/parley#79): runs with an equal inv (spec §2.2) whose outcome, reason, end status, error, warning and startup-failure codes and head's resolved are equal too, and whose result records are equal one for one in seq order: the tool's own records and any other record the protocol does not define, each page, each sidecar by its bytes and sha256, and a read's own lens without its session and the query it names, compared without the envelope's t, seq and run (flyingrobots/parley#133). A top-level session on a record of the tool's own or on a page is that record's own field and is compared (flyingrobots/parley#146). Under a view whose surface holds decision records those are equal as well, compared the same way: receipt.step under how-it-decided and everything, cache.hit under those two and what-ran. A decision record of a kind the view's surface does not hold is not compared, so runs that differ only in such records still stand for one another. Every comparison here is of the records the window holds: two runs whose results in the window differ are a divergence (spec §2.3) and do not stand for one another, and a run only partly inside the window is compared by the part the window holds, so runs that stand for one another under one window can differ under a wider one. A section marks a run the window did not hold whole in two cases: head not_in_window when the window does not hold the run's head, and outcome undetermined with reason no_end_in_window when it holds no end for the run and no failure either; a run the window shows to have failed is failed with or without its end, so its section does not say whether the window holds the end. This run is the most recent of them, by the latest t among each run's records in the window and, where those are equal, the greater run id; the others' records are not named, and stands_for lists the others' run ids. A run with no inv in the window, a run the window shows to be redacted (its head carries redacted, an end in the window states redacted true, or the window holds a redaction event of the run), and a run the window does not show to be unredacted, because it holds neither the run's receipt head nor an end that states redacted false, do not stand for another (spec §1.2a, §2.3). A run that stands for no other has no folded. Never dropped to fit the section's bound."
  folded: RunFolded @parley_optional
  "The fields left out, whole, to bound the section's serialised JSON, in the order they were dropped, each at most once: resolved, then argv, then inv, then v, then tool. The bound is the reader's to state (parley-read: 512 UTF-8 bytes); a string or an object is never cut part-way."
  dropped: [DroppedField!] @parley_optional @parley_minItems(value: 1) @parley_maxItems(value: 5)
}

type RecordRef @parley_open {
  run: String! @parley_minLength(value: 1)
  "0 for a bootstrap or startup-failure line (spec §1.3)."
  seq: Int! @parley_minimum(value: 0)
  "The named record's event token as the loader read it, a tool's own token included verbatim (flyingrobots/parley#77). Absent when the record carries none; never filled in."
  event: String @parley_optional @parley_minLength(value: 1)
  "The named record's POSIX time in milliseconds (spec §1.3) as the loader read it. Absent when the record has no usable t; never a made-up one."
  t: Int64 @parley_optional @parley_minimum(value: 0)
  "On an error or warning entry, the record's code (spec §6), so failures of one case read as one without opening them (flyingrobots/parley#83). Absent on any other record, and on a code that is not spec §6's shape; never filled in."
  code: String @parley_optional @parley_pattern(regex: "^[a-z0-9_]+(\\.[a-z0-9_]+)+$")
}

"The lens a result carries: the asker, the view, the budget and the window that produced it, the query it answers, a stated bound on what the view loses, and the records it was built from by (run, seq) (spec §9, informative; decided in flyingrobots/parley#46). One lens line precedes the result it describes, so a later reader knows what it is looking at and can get back to the records."
type Lens @parley_message(id: "parley.lens", version: "1.1.0", title: "parley lens") @parley_open
  @parley_when(path: ["loss", "bound"], equals: "none", guarded: true, set: {excluded: 0, folded: 0}) {
  event: String! @parley_const(string: "lens")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3)."
  seq: Int! @parley_minimum(value: 1)
  "The execution this line belongs to: the read itself, not the runs being read (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "Working period spanning runs. Supplied by the caller or inherited; never invented (spec §2.1)."
  session: String @parley_optional @parley_minLength(value: 1)
  "The recorded query this result answers, by (run, seq). Required: §9 records every query, and a result whose query was not recorded cannot be audited."
  query: LensQueryRef!
  "Echoed from the query: who the result is for."
  asker: LensAsker!
  "The view this result is. Echoed from the query, from the same closed set."
  view: String! @parley_enum(values: ["what-ran", "what-failed", "what-changed", "how-it-decided", "everything"])
  "The budget actually applied, including a default the query did not supply. Constitutive, not decoration: two results computed under different budgets are not comparable, so a lens without it does not identify the view that produced the result."
  budget: LensBudget!
  "The stretch of history the result covers, echoed from the query."
  window: LensWindow!
  "Echoed from the query, present exactly when the query states it (flyingrobots/parley#133). false: the read folded nothing, so loss.folded is 0 and no runs section carries folded because none was allowed to, not because no runs repeated. Two results over one window, one folded and one not, are not comparable, so a lens says which it is."
  fold: Boolean @parley_optional
  "What the view loses against the records it was built from, so a later reader knows which questions this result can still answer and cannot mistake a digest for the whole. A digest that folded runs names fewer records than it stands for, and says how many in folded."
  loss: LensLoss!
  "One section per run that records names, in the order records first names it, and none for any other run (flyingrobots/parley#83). It states once what is true of every record of the run — which invocation it was and what became of it — rather than on each entry. Read off the window's records when the lens is built, so it cannot drift from the head it summarises. Part of the line budget.bytes bounds. Optional so that lines written under the earlier drafts still validate; parley-read always writes it."
  runs: [RunSection!] @parley_optional
  "The records this result was built from, by (run, seq), never more than budget.records of them. Stored rather than recomputed: projecting down to a result is cheap and expanding back up may be impossible within a budget, so the way back has to be written here. A result is built from records, never from another result. Each entry may also carry a fixed summary of the record it names — event, t and, on an error or warning, its code — so a reader can choose what to open without opening it (flyingrobots/parley#77, flyingrobots/parley#83). What is true of the entry's whole run, its identity and outcome, is stated once in runs. The summary is read off the record when the lens is built and is part of the line budget.bytes bounds."
  records: [RecordRef!]!
  _schema: SchemaRef! @parley_message_ref
}

# ---------------------------------------------------------------------------------------------
# parley.history.transform
# ---------------------------------------------------------------------------------------------

"The opening line of a projected copy of a run on the shared history stream: every line of this run that follows on this stream is a projection of the receipt copy by the named transform, so a reader can tell a projected copy from a whole one and by what (spec §8, informative). Stream only: the receipt copy is never projected and never carries this line."
type HistoryTransform @parley_message(id: "parley.history.transform", version: "1.0.0", title: "parley history transform") @parley_open {
  event: String! @parley_const(string: "history.transform")
  "POSIX time in milliseconds (spec §1.3)."
  t: Int64! @parley_minimum(value: 0)
  "The run's single counter (spec §1.3). This line takes a seq of its own and reaches no other sink, so the receipt copy has no line at this seq."
  seq: Int! @parley_minimum(value: 1)
  "The execution whose copy on this stream is a projection (spec §2.1)."
  run: String! @parley_minLength(value: 1)
  "What the transform is called: the name its configuration gave it, or the function's own name."
  name: String! @parley_minLength(value: 1)
  "SHA-256, hex, of the transform's source text as the runtime renders it. It tells two projections apart and pins which one wrote this copy; it is not a build identity, and nothing fetches it."
  sha256: String! @parley_pattern(regex: "^[0-9a-f]{64}$")
  _schema: SchemaRef! @parley_message_ref
}
